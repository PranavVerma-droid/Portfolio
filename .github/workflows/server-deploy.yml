name: Deploy to Production Server

on:
  push:
    branches: [ "master" ]

jobs:
  wait-for-builds:
    runs-on: ubuntu-selfhosted
    steps:
      - name: Wait for Docker Build
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = ['docker-build-portfolio.yml'];
            const maxWaitTime = 600000; // 10 mins
            const startTime = Date.now();
            
            while (Date.now() - startTime < maxWaitTime) {
              const runs = await Promise.all(
                workflows.map(workflow => 
                  github.rest.actions.listWorkflowRuns({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: workflow,
                    head_sha: context.sha,
                    per_page: 1
                  })
                )
              );
              
              const allComplete = runs.every(run => 
                run.data.workflow_runs.length > 0 && 
                ['success', 'failure', 'cancelled'].includes(run.data.workflow_runs[0].conclusion)
              );
              
              const allSuccessful = runs.every(run => 
                run.data.workflow_runs.length > 0 && 
                run.data.workflow_runs[0].conclusion === 'success'
              );
              
              if (allComplete) {
                if (allSuccessful) {
                  console.log('Docker build completed successfully');
                  return;
                } else {
                  throw new Error('Docker build failed');
                }
              }
              
              console.log('Waiting for Docker build to complete...');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            
            throw new Error('Timeout waiting for Docker build to complete');

  deploy:
    runs-on: db1
    needs: wait-for-builds
    steps:
      - name: Deploy to server
        run: |
          echo "Starting deployment..."

          git config --global --add safe.directory /data/services/db1/portfolio/portfolio
          cd /data/services/db1/portfolio/portfolio || exit 1

          echo "Resetting local changes..."
          git reset --hard HEAD
          git clean -fd

          echo "Pulling latest changes..."
          git fetch origin
          git reset --hard origin/master

          echo "Pulling latest Docker image..."
          cd /data/services/db1/portfolio || exit 1
          docker compose pull web || exit 1

          echo "Starting container..."
          docker compose up -d --remove-orphans web || exit 1

          echo "Waiting for the site to respond..."
          for i in $(seq 1 30); do
            if docker compose exec -T web wget -qO- http://127.0.0.1:8080/robots.txt > /dev/null 2>&1; then
              echo "Site is up."
              break
            fi
            [ "$i" = 30 ] && { echo "Site did not come up"; docker compose logs --tail 50 web; exit 1; }
            sleep 2
          done

          docker image prune -f

          echo "Deployment completed successfully"
        shell: bash
