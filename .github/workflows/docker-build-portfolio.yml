name: Portfolio Docker Build

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Build the portfolio Docker image
      run: |
        docker build main \
          --pull \
          --tag ghcr.io/pranavverma-droid/portfolio-main:latest \
          --tag ghcr.io/pranavverma-droid/portfolio-main:${{ github.sha }}

    - name: Login to GitHub Container Registry
      run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u PranavVerma-droid --password-stdin

    - name: Push the Docker image
      run: |
        docker push ghcr.io/pranavverma-droid/portfolio-main:${{ github.sha }}
        docker push ghcr.io/pranavverma-droid/portfolio-main:latest
