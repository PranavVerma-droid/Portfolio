<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="icon" href="/favicon.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="/Home/CSS/sky.css">
    <style>
        .lost {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            align-content: center;
            gap: 0;
            max-width: 1320px;
            margin: 0 auto;
            padding: 120px var(--gutter);
        }

        .lost .code {
            font: 300 clamp(110px, 22vw, 300px)/.85 var(--f-display);
            letter-spacing: -.03em;
            color: var(--gold);
            text-shadow: 0 0 60px var(--glow-gold);
        }

        .lost h1 {
            margin: 22px 0 18px;
            font: 300 clamp(40px, 6vw, 84px)/1 var(--f-display);
            letter-spacing: -.015em;
            text-wrap: balance;
        }

        .lost h1 em { font-style: italic; color: var(--rose); }

        .lost p { max-width: 34em; margin: 0; font-size: clamp(17px, 1.6vw, 20px); opacity: .9; }

        .lost .home {
            justify-self: start;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 34px;
            padding: 13px 22px;
            border-radius: 99px;
            background: var(--gold);
            color: var(--night);
            font: 600 15px/1 var(--f-body);
            text-decoration: none;
            transition: transform .25s, box-shadow .25s;
        }

        .lost .home:hover { transform: translateY(-2px); box-shadow: 0 10px 40px -8px var(--glow-gold); }

        .lost .fact { margin-top: 70px; display: grid; gap: 12px; max-width: 520px; }
        .lost .fact .fact-text { font-size: clamp(18px, 2.4vw, 22px); }
    </style>
</head>

<body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="aurora" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <main class="lost">
        <span class="eyebrow">Error 404 · off the chart</span>
        <div class="code" aria-hidden="true">404</div>
        <h1>This page drifted into <em>another universe</em>.</h1>
        <p>The page you are looking for is not in this sky. Let's take you back home.</p>
        <a class="home" href="/index.html">Go back to the home page</a>

        <div class="fact">
            <span class="fact-label">While you're here · did you know</span>
            <p class="fact-text" data-fact>There are 88 officially recognised constellations, covering the whole sky between them.</p>
        </div>
    </main>

    <script src="/Home/Javascript/sky.js"></script>
</body>

</html>
