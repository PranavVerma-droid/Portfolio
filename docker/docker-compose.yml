name: pranavs-portfolio
services:
  web:
    image: ghcr.io/pranavverma-droid/portfolio-main:latest
    container_name: portfolio-main
    ports:
      - "${PORT:-5646}:8080"
    environment:
      PB_URL: ${PB_URL:-https://pb-1.pranavv.co.in}
    restart: always
